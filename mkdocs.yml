          - Pneumonia Detection: projects/pneumonia-detection.md
          - getSensData: projects/getsensdata.md
          - OCR IT-09: projects/ocr-it09.md
  - Blog:
      - Overview: blog/index.md
      - "Crafting Agent-Based Systems with Graph Orchestration and...": blog/2026-04-20-crafting-agent-based-systems-with-graph-orchestrat.md
      - "Strategic Integration of Multiple Large Language Model Pr...": blog/2026-04-20-strategic-integration-of-multiple-large-language-m.md
      - "Crafting Agent-Based Systems with Graph Orchestration and...": blog/2026-04-20-crafting-agent-based-systems-with-graph-orchestrat.md
      - "Implementing Orchestrated Agent Workflows with Human-in-t...": blog/2026-04-20-implementing-orchestrated-agent-workflows-with-hum.md
      - "Preventing Arrow Errors in Diagrams with Mermaid Syntax G...": blog/2026-01-23-preventing-arrow-errors-in-diagrams-with-mermaid-s.md
      - "Implementing a Secure and Configurable Blog Agent": blog/2026-01-23-implementing-a-secure-and-configurable-blog-agent.md
      - "Optimizing API Endpoints for User Information Retrieval": blog/2026-01-23-optimizing-api-endpoints-for-user-information-retr.md
      - "Implementing Efficient Large Language Models for Content ...": blog/2026-01-23-implementing-efficient-large-language-models-for-c.md
      - "Implementing Orchestration and Workflow Management in Mod...": blog/2026-01-23-implementing-orchestration-and-workflow-management.md
      - "Implementing a Scalable Machine Learning Recommendation S...": blog/2026-01-23-implementing-a-scalable-machine-learning-recommend.md
