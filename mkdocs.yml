site_name: Robiriu Labs
site_description: AI Research & Development Portfolio of Robi Dany Riupassa
site_author: Robi Dany Riupassa
site_url: https://robiriu.github.io/

# Copyright
copyright: Copyright &copy; 2022 - 2026 Robi Dany Riupassa

# Theme Configuration
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - javascript
    - bash

# Navigation
nav:
  - Home: index.md
  - About:
      - Overview: about/index.md
      - Education: about/education.md
      - Experience: about/experience.md
      - Publications: about/publications.md
  - Projects:
      - Overview: projects/index.md
      - "Flagship — ForceX AI":
          - ForceX AI Platform: projects/forcex-ai.md
          - GeoForce (CNN Surrogate): projects/geoforce.md
      - GenAI & LLM Systems:
          - Enterprise Agentic RAG: projects/enterprise-agentic-rag.md
          - Agentic HR Intelligence: projects/agentic-hr-platform.md
          - AI Help & QnA (RAG): projects/ai-help-qna.md
          - Porto Agent: projects/porto-agent.md
      - MLOps & Infrastructure:
          - Broadcast Analytics (MLOps): projects/broadcast-analytics.md
          - Media Platform (AdCP): projects/media-platform.md
      - Developer Tools:
          - AI Testing Framework (ATP): projects/ai-testing-framework.md
      - Research:
          - Recommendation Systems: projects/recommendation-systems-research.md
  - Blog: blog/index.md
  - Activities:
      - Overview: activities/index.md
      - Workshops & Webinars: activities/events.md
  - Contact: contact.md

# Extensions
markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
  - sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Plugins
plugins:
  - search

# Extra CSS for Mermaid styling
extra_css:
  - stylesheets/mermaid-custom.css

# Extra JavaScript for Mermaid
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
