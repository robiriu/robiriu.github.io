      - Computer Vision: blog/computer-vision.md
  - Activities:
      - Overview: activities/index.md
      - Workshops & Webinars: activities/events.md
  - Contact: contact.md

# Extensions
markdown_extensions:
  - admonition
  - def_list
  - footnotes
  - toc:
      permalink: true
  - codehilite:
      guess_lang: false
  - sane_lists
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Plugins
plugins:
  - search

# Extra CSS for Mermaid styling
extra_css:
  - stylesheets/mermaid-custom.css

# Extra JavaScript for Mermaid
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js
